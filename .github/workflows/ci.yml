name: Deploy (demo)

# Entry point. One pair of top-level jobs per project, dev -> qa, so the run graph shows the
# development legs in the left column and each QA leg to the right of its own project.
# A failing dev leg only skips the QA leg it points to.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Fake version to "deploy"; empty uses the default in deploy.yml'
        required: false
      fail_dev_of:
        description: 'Project name whose dev leg should fail, to see that only its QA is skipped (e.g. cvc)'
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- cvc ----
  dev-cvc:
    name: dev · cvc
    uses: ./.github/workflows/deploy.yml
    with:
      stage: dev
      project: cvc
      family: svc-cvc-dev
      version: ${{ inputs.version }}
      fail: ${{ inputs.fail_dev_of == 'cvc' }}

  qa-cvc:
    name: qa · cvc
    needs: dev-cvc
    uses: ./.github/workflows/deploy.yml
    with:
      stage: qa
      project: cvc
      family: svc-cvc-qa
      version: ${{ inputs.version }}

  # ---- uac ----
  dev-uac:
    name: dev · uac
    uses: ./.github/workflows/deploy.yml
    with:
      stage: dev
      project: uac
      family: svc-uac-dev
      version: ${{ inputs.version }}
      fail: ${{ inputs.fail_dev_of == 'uac' }}

  qa-uac:
    name: qa · uac
    needs: dev-uac
    uses: ./.github/workflows/deploy.yml
    with:
      stage: qa
      project: uac
      family: svc-uac-qa
      version: ${{ inputs.version }}
